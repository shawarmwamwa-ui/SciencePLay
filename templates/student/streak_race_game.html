<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streak Race — Plant Parts Game | SciencePlay</title>
  <meta name="description" content="Grade 3 Science game: Answer plant-parts questions correctly to advance your character along the track to the finish line.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/streakRaceGame.css') }}">
</head>
<body>
  <div class="sr-page">

    <!-- ── Header ──────────────────────────────────────────────────────────── -->
    <header class="sr-header">
      <div class="d-flex align-items-center gap-3 flex-wrap">
        <a href="{{ url_for('student.activities') }}" class="sr-back-btn" id="sr-back-link">
          <i class="bi bi-arrow-left-circle-fill"></i>
          <span>Back to Activities</span>
        </a>
        <div class="sr-header-title">
          <h1><i class="bi bi-lightning-fill me-2 text-success"></i>Streak Race</h1>
          <p>Answer correctly to race your way to the finish line</p>
        </div>
      </div>
    </header>

    <!-- ── Game container ──────────────────────────────────────────────────── -->
    <main id="sr-container" role="main">
      <!-- Rendered dynamically by streakRaceGame.js -->
    </main>

  </div>

  <script>
    window.streakRaceActivityId = {{ activity_id if activity_id else 'null' }};
  </script>
  <script type="module">
    import { initStreakRace } from "{{ url_for('static', filename='js/streakRaceGame.js') }}";
    document.addEventListener('DOMContentLoaded', initStreakRace);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
