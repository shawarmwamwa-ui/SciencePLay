<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Body Parts — Interactive Lesson | SciencePlay</title>
  <meta name="description" content="Grade 3 Science: Discover how animal body parts like the head, legs, and wings help animals move and find food.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bodyPartsLesson.css', v='20260903_2') }}">
  <script defer src="{{ url_for('static', filename='js/lottie.min.js') }}"></script>
</head>
<body>
  <div class="bpl-page">

    <!-- ── Header ─────────────────────────────────────────────────────────── -->
    <header class="bpl-header">
      <a href="{{ url_for('student.lessons') }}" class="bpl-back-btn">
        <i class="bi bi-arrow-left-circle-fill"></i>
        <span>Back to Lessons</span>
      </a>
      <div class="bpl-title-group">
        <h1><i class="bi bi-person-circle me-2 text-primary"></i>Animal Body Parts</h1>
        <p>Movement and Feeding Adaptations</p>
      </div>
      <div class="bpl-progress-bar" aria-label="Lesson progress">
        <div id="bpl-progress-fill" class="bpl-progress-fill" style="width:0%"></div>
      </div>
    </header>

    <!-- ── Slide Card ──────────────────────────────────────────────────────── -->
    <main class="bpl-card" role="main">
      <div class="bpl-card-header">
        <div class="bpl-window-dots">
          <span class="bpl-dot bpl-dot-red"></span>
          <span class="bpl-dot bpl-dot-yellow"></span>
          <span class="bpl-dot bpl-dot-green"></span>
        </div>
      </div>

      <div class="bpl-card-body">
        <div class="bpl-slide-titlebar">
          <h2 id="bpl-title" class="bpl-slide-title"></h2>
          <div class="d-flex align-items-center gap-2 flex-wrap">
            <button id="bpl-tts-btn" class="bpl-tts-btn" title="Read slide aloud">
              <i class="bi bi-volume-up-fill"></i><span>Read Aloud</span>
            </button>
            <span id="bpl-progress-text" class="bpl-progress-text"></span>
          </div>
        </div>

        <!-- Slide content injected here -->
        <div id="bpl-content"></div>

        <!-- Navigation -->
        <nav class="bpl-nav" aria-label="Slide navigation">
          <button id="bpl-prev" class="bpl-nav-btn bpl-btn-prev" disabled>
            <i class="bi bi-arrow-left-circle-fill"></i> Back
          </button>
          <button id="bpl-next" class="bpl-nav-btn bpl-btn-next" disabled>
            Next <i class="bi bi-arrow-right-circle-fill"></i>
          </button>
        </nav>
      </div>
    </main>

  </div><!-- /bpl-page -->

  <script>
    window.currentLessonId = {{ lesson.id if lesson else 'null' }};
    window.initialSlide = {{ initial_slide if initial_slide is defined else 0 }};
  </script>
  <script type="module">
    import { ANIMAL_BODY_PARTS_SLIDES } from "{{ url_for('static', filename='js/animalBodyPartsLessonData.js', v='20260903_2') }}";
    import { initBodyPartsLesson } from "{{ url_for('static', filename='js/bodyPartsLesson.js', v='20260903_2') }}";
    initBodyPartsLesson(ANIMAL_BODY_PARTS_SLIDES, window.currentLessonId, 'Animal Body Parts', window.initialSlide);
  </script>
  <script defer src="{{ url_for('static', filename='js/online_tracker.js') }}"></script>
</body>
</html>
