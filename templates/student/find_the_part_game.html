<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find the Part — Animal Body Parts Game | SciencePlay</title>
  <meta name="description" content="Grade 3 Science game: Tap the correct label and match it to the right body zone on three different animals.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preload" as="image" href="{{ url_for('static', filename='images/ftp_bird.webp') }}" type="image/webp" fetchpriority="high">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/student.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/findThePartGame.css', v='20260903_5') }}">
</head>
<body>
  <div class="ftp-page">

    <!-- ── Header ──────────────────────────────────────────────────────────── -->
    <header class="ftp-header">
      <div class="d-flex align-items-center gap-3 flex-wrap">
        <a href="{{ url_for('student.activities') }}" class="ftp-back-btn" id="ftp-back-link">
          <i class="bi bi-arrow-left-circle-fill"></i>
          <span>Back to Activities</span>
        </a>
        <div class="ftp-header-title">
          <h1><i class="bi bi-crosshair2 me-2 text-primary"></i>Find the Part</h1>
          <p>Label each animal's body parts by matching them correctly</p>
        </div>
      </div>
      <div class="ftp-hud">
        <div class="ftp-score-badge">
          <i class="bi bi-star-fill"></i>
          <span id="ftp-score">0</span>
        </div>
      </div>
    </header>

    <!-- ── Game container ──────────────────────────────────────────────────── -->
    <main id="ftp-container" role="main">
      <!-- Rendered dynamically by findThePartGame.js -->
    </main>

  </div>

  <audio id="game-bgm" loop preload="none">
    <source src="{{ url_for('static', filename='audio/Piki - Happy Walking (freetouse.com).mp3') }}" type="audio/mpeg">
  </audio>

  <script>
    window.findThePartActivityId = {{ activity_id if activity_id else 'null' }};
    window.initialAttemptsToday = {{ attempts_today if attempts_today is defined else 0 }};
  </script>
  <script type="module">
    import { initFindThePart } from "{{ url_for('static', filename='js/findThePartGame.js', v='20260922_1') }}";
    import { initBgmPlayer } from "{{ url_for('static', filename='js/bgmPlayer.js') }}";
    initFindThePart();
    initBgmPlayer('game-bgm', { volume: 0.20, storageKey: 'scienceplay_game_bgm_muted' });
  </script>
  <script defer src="{{ url_for('static', filename='js/online_tracker.js') }}"></script>
</body>
</html>
