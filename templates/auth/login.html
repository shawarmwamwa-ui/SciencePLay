<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SciencePlay Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
  <style>
    input[type="password"]::-ms-reveal,
    input[type="password"]::-ms-clear,
    input[type="password"]::-webkit-credentials-auto-fill-button,
    input[type="password"]::-webkit-search-decoration,
    input[type="password"]::-webkit-search-cancel-button,
    input[type="password"]::-webkit-search-results-button,
    input[type="password"]::-webkit-search-results-decoration {
      display: none !important;
    }
  </style>
</head>
<body class="login-page">
  <!-- Alerts -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="container mt-3">
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <div class="login-wrapper">
    <div class="login-card">
      <div class="card-body">
        <div class="login-icon-box">
          <span class="icon-emoji">🧪</span>
        </div>
        <h2 class="card-title mb-2 text-center">SciencePlay</h2>
        <p class="text-center text-muted mb-4">Learn Science through play</p>

            <!-- Login Form -->
            <form method="POST" action="{{ url_for('auth.login') }}">
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-control" required>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                  <input type="password" id="password" name="password" class="form-control" required>
                  <button class="btn btn-outline-secondary" type="button" onclick="togglePassword(event, 'password', this)">
                    <i class="bi bi-eye" aria-hidden="true"></i>
                    <span class="visually-hidden">Toggle password visibility</span>
                  </button>
                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
