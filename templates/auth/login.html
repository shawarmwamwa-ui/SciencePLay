<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SciencePlay — Login</title>
  <meta name="description" content="SciencePlay Portal Login: Access interactive science learning for students and teachers.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">
  
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="login-page">
  <div class="background"></div>

  <div class="brutal-login-window">
    <!-- Neubrutalist Window Titlebar -->
    <div class="brutal-window-header">
      <div class="brutal-dots">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
      </div>
    </div>

    <div class="brutal-window-body p-4 p-md-5">
      <div class="text-center mb-4">
        <h1 class="logo-title mb-2">
          <span class="c1">S</span><span class="c2">c</span><span class="c3">i</span><span class="c4">e</span><span class="c5">n</span><span class="c6">c</span><span class="c7">e</span><span class="c8">P</span><span class="c9">l</span><span class="c10">a</span><span class="c11">y</span>
        </h1>
        <div class="d-inline-block">
          <span class="tagline-badge"><i class="bi bi-rocket-takeoff-fill me-1 text-warning"></i>Learn Science Through Play!</span>
        </div>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} brutal-alert alert-dismissible fade show mb-4" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="mb-3">
          <label for="username" class="brutal-label mb-1"><i class="bi bi-person-fill me-1"></i>Username</label>
          <div class="input-group brutal-input-group">
            <span class="input-group-text brutal-input-icon"><i class="bi bi-person text-dark fs-5"></i></span>
            <input type="text" id="username" name="username" class="form-control brutal-input" placeholder="Enter your username" required autocomplete="username">
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="brutal-label mb-1"><i class="bi bi-key-fill me-1"></i>Password</label>
          <div class="input-group brutal-input-group">
            <span class="input-group-text brutal-input-icon"><i class="bi bi-lock text-dark fs-5"></i></span>
            <input type="password" id="password" name="password" class="form-control brutal-input" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="btn brutal-toggle-pwd-btn" onclick="togglePassword(event, 'password', this)" aria-label="Toggle password visibility" title="Show/Hide password">
              <i class="bi bi-eye-fill fs-5"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="brutal-btn-login">
          <span>LOG IN NOW</span>
          <i class="bi bi-arrow-right-circle-fill ms-2 fs-4"></i>
        </button>
      </form>
    </div>
  </div>

  <audio id="login-audio" loop preload="none">
    <source src="{{ url_for('static', filename='audio/Piki - Kitty (freetouse.com).mp3') }}" type="audio/mpeg">
  </audio>

  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script defer src="{{ url_for('static', filename='js/auth.js') }}"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (window.initLoginMusic) {
        window.initLoginMusic();
      }
      if (window.initAuthToasts) {
        window.initAuthToasts();
      }
    });
  </script>
</body>
</html>
