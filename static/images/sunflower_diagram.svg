<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- Transparent background vector sunflower diagram -->
  <!-- Stem -->
  <path d="M 150 150 L 150 280" stroke="#16a34a" stroke-width="12" stroke-linecap="round"/>

  <!-- Leaves -->
  <path d="M 150 220 C 110 200 90 230 150 240 Z" fill="#22c55e" stroke="#15803d" stroke-width="3"/>
  <path d="M 150 200 C 190 180 210 210 150 220 Z" fill="#22c55e" stroke="#15803d" stroke-width="3"/>

  <!-- Petals -->
  <g fill="#facc15" stroke="#eab308" stroke-width="3">
    <ellipse cx="150" cy="50" rx="14" ry="32"/>
    <ellipse cx="150" cy="210" rx="14" ry="32"/>
    <ellipse cx="70" cy="130" rx="32" ry="14"/>
    <ellipse cx="230" cy="130" rx="32" ry="14"/>
    
    <ellipse cx="93" cy="73" rx="14" ry="32" transform="rotate(-45 93 73)"/>
    <ellipse cx="207" cy="187" rx="14" ry="32" transform="rotate(-45 207 187)"/>
    <ellipse cx="207" cy="73" rx="14" ry="32" transform="rotate(45 207 73)"/>
    <ellipse cx="93" cy="187" rx="14" ry="32" transform="rotate(45 93 187)"/>
  </g>

  <!-- Flower Center -->
  <circle cx="150" cy="130" r="45" fill="#78350f" stroke="#451a03" stroke-width="4"/>
  <circle cx="150" cy="130" r="35" fill="#92400e"/>
</svg>
