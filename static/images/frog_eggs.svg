<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="eggGrad1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#bae6fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
    </radialGradient>
    <radialGradient id="eggGrad2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#a7f3d0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.3"/>
    </radialGradient>
    <filter id="eggShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0369a1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Water Bubble Base Cluster -->
  <g filter="url(#eggShadow)">
    <!-- Egg 1 (Top Left) -->
    <circle cx="42" cy="40" r="24" fill="url(#eggGrad1)" stroke="#0284c7" stroke-width="2.5"/>
    <circle cx="42" cy="40" r="8" fill="#1e293b"/>
    <circle cx="39" cy="37" r="2.5" fill="#ffffff"/>

    <!-- Egg 2 (Top Right) -->
    <circle cx="78" cy="45" r="22" fill="url(#eggGrad2)" stroke="#059669" stroke-width="2.5"/>
    <circle cx="78" cy="45" r="7.5" fill="#1e293b"/>
    <circle cx="75" cy="42" r="2.2" fill="#ffffff"/>

    <!-- Egg 3 (Bottom Center) -->
    <circle cx="58" cy="78" r="26" fill="url(#eggGrad1)" stroke="#0284c7" stroke-width="2.5"/>
    <circle cx="58" cy="78" r="9" fill="#1e293b"/>
    <circle cx="55" cy="75" r="3" fill="#ffffff"/>

    <!-- Small Bubble Glistening Details -->
    <circle cx="30" cy="65" r="10" fill="url(#eggGrad2)" stroke="#0ea5e9" stroke-width="1.8" opacity="0.8"/>
    <circle cx="30" cy="65" r="3" fill="#1e293b"/>
    <circle cx="86" cy="75" r="12" fill="url(#eggGrad1)" stroke="#0284c7" stroke-width="2" opacity="0.85"/>
    <circle cx="86" cy="75" r="4" fill="#1e293b"/>
  </g>
</svg>
